[package]
name = "checkbookmark"
version = "0.1.4"
edition = "2024"
description = "bookmark URL validity checker TUI"
license = "MIT"
repository = "https://github.com/ysoftman/checkbookmark"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dirs = "6"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
md-5 = "0.10"
