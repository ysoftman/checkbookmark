[package]
name = "checkbookmark"
version = "0.1.0"
edition = "2024"
description = "bookmark URL validity checker TUI"
license = "MIT"
repository = "https://github.com/ysoftman/checkbookmark"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = [
  "rustls-tls",
], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dirs = "6"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
